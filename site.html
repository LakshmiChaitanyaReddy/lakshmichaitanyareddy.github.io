<!-- site.html — the PORTFOLIO RENDERER SHELL.

     DO NOT DELETE THIS FILE. It looks unused because nothing links to it:
     no <a href> anywhere points here, and opening it directly shows an
     empty page. It is a SHELL — the server and the builder read it and fill
     it in. service/src/index.js refuses to boot without it.

     Five things depend on it:
       1. /u/<slug>  — hosted customer pages. The server reads this file and
          injects the owner's title/description/OG tags server-side, because
          a crawler never runs our JavaScript.  (index.js, hostedPage)
       2. /, /pricing, /ats and every other PLATFORM page. Same shell, with
          the portfolio boot swapped for the platform-page boot.  (index.js, platformShell)
       3. The builder's live preview iframe, as site.html?preview=1.
       4. A customer's GitHub Pages deploy: this file is committed to their
          repo AS index.html.  (routes/publish.js)
       5. It is the STYLESHEET for all of the above. Every :root theme token
          fallback and every layout's CSS — the section styles, the
          horizontal rails, the ATS widget, the footer columns, the pricing
          table — lives in the <style> block below. Delete it and hosted
          pages, platform pages and exported sites all render unstyled.

     Empty tags below are placeholders; render.js fills them from the data. -->

<style>
/* ══════════════════════════════════════════════════════════════════════
   THEME TOKENS — DEFAULTS ONLY.
   js/themes.js writes the active theme as inline custom properties on
   <html>, which beat everything here, so the site still renders correctly
   if a script or data.json fails to load. Change the look from the builder's
   Theme tab; change this block to change the fallback.
   app.html carries an identical copy of both blocks.
   ══════════════════════════════════════════════════════════════════════ */
:root {
  /* ── Accent. Only --accent is authored; the rest derive from it. ───── */
  --accent:        #5cc8a8;
  --accent-lift:   #ffffff;                                           /* mixed in for hover      */
  --accent-strong: color-mix(in srgb, var(--accent) 78%, var(--accent-lift));
  --accent-soft:   color-mix(in srgb, var(--accent) 12%, transparent);
  --on-accent:     #06120e;                                           /* text ON filled accent   */

  /* ── Feedback ───────────────────────────────────────────────────────── */
  --danger: #ff6b6b;
  --warn:   #e3b341;

  /* ── Surfaces: page → alt band → card → chip ─────────────────────────── */
  --bg:        #0d1117;
  --bg-alt:    #10161f;
  --surface:   #151c26;
  --surface-2: #1b2430;
  --header-bg: color-mix(in srgb, var(--bg) 80%, transparent);

  /* ── Text: three levels of emphasis ─────────────────────────────────── */
  --text:      #e8edf4;
  --text-mid:  #b3bdcb;
  --text-dim:  #7d8899;

  /* ── Lines & shadow ─────────────────────────────────────────────────── */
  --border:   #232d3b;
  --border-2: #303d4e;
  --shadow:   0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);

  /* ── Typography ─────────────────────────────────────────────────────── */
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-body:    "Inter", system-ui, -apple-system, sans-serif;
  --font-mono:    "JetBrains Mono", ui-monospace, "SF Mono", monospace;
  --fs-scale:     1;          /* multiplies every rem on the page  */
  --h-scale:      1;          /* multiplies heading sizes only     */
  --line-height:  1.7;
  --h-weight:     600;
  --h-tracking:   -0.02em;

  /* ── Shape & density ────────────────────────────────────────────────── */
  --maxw:        1640px;
  --radius:      14px;
  --radius-sm:   8px;
  --chip-radius: 6px;
  --gutter:      clamp(1.25rem, 5vw, 2.5rem);
  --section-y:   clamp(4.5rem, 10vw, 7.5rem);
  --gap:         1.1rem;
  --nav-h:       68px;

  /* ── Motion ─────────────────────────────────────────────────────────── */
  --ease:  cubic-bezier(.22,.61,.36,1);
  --speed: .35s;
}

[data-theme="light"] {
  --accent:      #0f8a6a;
  --accent-lift: #000000;
  --on-accent:   #ffffff;
  --danger:      #c62828;
  --warn:        #8a6100;
  --bg:        #fbfbf9;
  --bg-alt:    #f3f4f1;
  --surface:   #ffffff;
  --surface-2: #f1f3f0;
  --text:      #14181d;
  --text-mid:  #414a55;
  --text-dim:  #6b7480;
  --border:    #e2e4e0;
  --border-2:  #c9cdc7;
  --shadow:    0 1px 2px rgba(20,24,29,.05), 0 12px 28px rgba(20,24,29,.07);
}

/* ══════════════════════════════════════════════════════════════════════
   BASE
   ══════════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html {
  font-size: calc(100% * var(--fs-scale));
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--nav-h) + 20px);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text-mid);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: var(--line-height);
  -webkit-font-smoothing: antialiased;
  transition: background-color var(--speed) var(--ease), color var(--speed) var(--ease);
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  color: var(--text);
  line-height: 1.18;
  margin: 0 0 .6rem;
  letter-spacing: var(--h-tracking);
  font-weight: var(--h-weight);
}
h1 { font-size: calc(clamp(2.15rem, 6.4vw, 3.55rem) * var(--h-scale)); }
h2 { font-size: calc(clamp(1.55rem, 3.6vw, 2.1rem) * var(--h-scale)); }
h3 { font-size: calc(1.125rem * var(--h-scale)); }
h4 { font-size: calc(.95rem * var(--h-scale)); }
p  { margin: 0 0 1rem; }
ul, ol { margin: 0; padding: 0; list-style: none; }

a { color: var(--accent); text-decoration: none; transition: color .2s var(--ease); }
a:hover { color: var(--accent-strong); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

img { max-width: 100%; height: auto; display: block; }
svg { vertical-align: middle; }

.container { width: 100%; max-width: var(--maxw); margin-inline: auto; padding-inline: var(--gutter); }

.visually-hidden {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.skip-link {
  position: absolute; left: -9999px; top: 0; z-index: 200;
  background: var(--accent); color: var(--on-accent);
  padding: .7rem 1.1rem; font-weight: 600; border-radius: 0 0 var(--radius-sm) 0;
}
.skip-link:focus { left: 0; color: var(--on-accent); }

.noscript {
  margin: 0; padding: 1rem var(--gutter);
  background: var(--surface); border-bottom: 1px solid var(--border);
  text-align: center; font-size: .95rem;
}

/* ══════════════════════════════════════════════════════════════════════
   ICONS — three shapes come out of js/icons.js: a stroked Lucide <svg>,
   a filled brand <svg>, or an <img> for a URL/uploaded logo.
   ══════════════════════════════════════════════════════════════════════ */
.icon { width: 1em; height: 1em; flex: none; }
svg.icon { stroke-width: 2; }
svg.icon-brand, svg.icon-mono { stroke-width: 0; }
img.icon { width: 1.05em; height: 1.05em; object-fit: contain; border-radius: 2px; }
.contact-list .icon, .project-links .icon, .custom-links .icon { width: 1.15em; height: 1.15em; }

/* ── Logo animations. Driven by theme.iconAnimation in data.json. ────── */
.ia-lift, .ia-pop, .ia-spin, .ia-swing { transition: transform .24s var(--ease); }
.ia-glow { transition: filter .24s var(--ease); }
a:hover > .ia-lift,  button:hover > .ia-lift,  li:hover .ia-lift  { transform: translateY(-2px); }
a:hover > .ia-pop,   button:hover > .ia-pop,   li:hover .ia-pop   { transform: scale(1.18); }
a:hover > .ia-spin,  button:hover > .ia-spin,  li:hover .ia-spin  { transform: rotate(360deg); }
a:hover > .ia-swing, button:hover > .ia-swing, li:hover .ia-swing { transform: rotate(-12deg); }
a:hover > .ia-glow,  button:hover > .ia-glow,  li:hover .ia-glow  { filter: drop-shadow(0 0 6px var(--accent)); }
.ia-float { animation: icon-float 3.2s ease-in-out infinite; }
@keyframes icon-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.ia-draw :is(path, rect, circle, line, polyline) {
  stroke-dasharray: 140; stroke-dashoffset: 140;
  animation: icon-draw 1.2s var(--ease) forwards;
}
@keyframes icon-draw { to { stroke-dashoffset: 0; } }

/* ══════════════════════════════════════════════════════════════════════
   HEADER / NAV
   ══════════════════════════════════════════════════════════════════════ */
.site-header {
  position: sticky; top: 0; z-index: 100;
  background: var(--header-bg);
  backdrop-filter: saturate(160%) blur(12px);
  -webkit-backdrop-filter: saturate(160%) blur(12px);
  border-bottom: 1px solid transparent;
  transition: border-color var(--speed) var(--ease), background-color var(--speed) var(--ease);
}
.site-header.is-stuck { border-bottom-color: var(--border); }

.nav { display: flex; align-items: center; justify-content: space-between; gap: 1rem; height: var(--nav-h); }
.brand { font-family: var(--font-mono); font-size: .95rem; font-weight: 500; color: var(--text); white-space: nowrap; }
.brand:hover { color: var(--text); }
.brand .dot { color: var(--accent); }

.nav-links { display: none; align-items: center; gap: .15rem; }
.nav-links a {
  display: block; padding: .45rem .7rem; border-radius: var(--radius-sm);
  font-size: .875rem; font-weight: 500; color: var(--text-dim);
  transition: color .2s var(--ease), background-color .2s var(--ease);
}
.nav-links a:hover { color: var(--text); background: var(--surface-2); }
.nav-links a.is-active { color: var(--accent); }

.nav-actions { display: flex; align-items: center; gap: .5rem; }
.pf-cta { font-size: .8rem; padding: .5rem .7rem; white-space: nowrap; }
@media(max-width:600px) { .nav-actions .pf-cta { display: none; } }
.profile-wrap { position: relative; }
.pbtn { display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--border-2);background:var(--surface-2);color:var(--text);cursor:pointer;padding:0 }
.pavatar { font-family:var(--font-display);font-size:.85rem;font-weight:600;line-height:1 }
.pmenu { position:absolute;top:calc(100% + 8px);right:0;min-width:226px;z-index:120;display:flex;flex-direction:column;gap:2px;padding:6px;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius-sm);box-shadow:var(--shadow) }
.pmenu .pwho { padding:7px 9px 8px;font-size:.78rem;color:var(--text-dim);word-break:break-all;border-bottom:1px solid var(--border);margin-bottom:3px }
.pmenu .pitem { display:block;width:100%;text-align:left;padding:8px 9px;border:0;border-radius:6px;background:none;color:var(--text);font-family:var(--font-body);font-size:.88rem;font-weight:500;cursor:pointer }
.pmenu .pitem:hover { background:var(--surface-2);color:var(--text) }
.pmenu .pitem.is-danger { color:var(--danger) }
.pdiv { height:1px;background:var(--border);margin:3px 0 }
.mk-template-preview { height:210px;overflow:hidden;background:#fff;border-bottom:1px solid var(--border); }
.mk-template-preview iframe { width:400%;height:840px;border:0;transform:scale(.25);transform-origin:top left;pointer-events:none;display:block; }
/* The way into the product, on someone else's portfolio. Small enough not to
   compete with the owner's own content, visible enough to be found. */
.pf-cta { padding: .42rem .8rem; font-size: .82rem; white-space: nowrap; }
.pf-made { font-weight: 500; }
@media (max-width: 560px) { .pf-cta-login { display: none; } }

.icon-btn {
  display: inline-grid; place-items: center;
  width: 38px; height: 38px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: transparent; color: var(--text-mid);
  cursor: pointer; font-size: 1.05rem;
  transition: border-color .2s var(--ease), color .2s var(--ease), background-color .2s var(--ease);
}
.icon-btn:hover { color: var(--text); border-color: var(--border-2); background: var(--surface-2); }

[data-theme="dark"]  .i-sun  { display: block; }
[data-theme="dark"]  .i-moon { display: none; }
[data-theme="light"] .i-sun  { display: none; }
[data-theme="light"] .i-moon { display: block; }

.mobile-menu { display: none; border-top: 1px solid var(--border); background: var(--bg); }
.mobile-menu.is-open { display: block; }
.mobile-menu ul { padding: .6rem 0 1rem; }
.mobile-menu a {
  display: block; padding: .7rem .25rem; font-size: 1rem; font-weight: 500;
  color: var(--text-mid); border-bottom: 1px solid var(--border);
}
.mobile-menu a.is-active { color: var(--accent); }

@media (min-width: 960px) {
  .nav-links { display: flex; }
  #menu-toggle, .mobile-menu { display: none !important; }
  .nav-links a { white-space: nowrap; }
  /* The link row may never widen the page: it clips inside the header
     until fitNav() swaps it for the menu button. */
  .nav-links { min-width: 0; overflow: hidden; overflow: clip; overflow-clip-margin: 6px; }
  /* js/site.js fitNav(): too many links for one row → use the menu. */
  .site-header.nav-overflow .nav-links { display: none; }
  .site-header.nav-overflow #menu-toggle { display: inline-grid !important; }
  .site-header.nav-overflow .mobile-menu.is-open { display: block !important; }
}

/* ══════════════════════════════════════════════════════════════════════
   BUTTONS
   ══════════════════════════════════════════════════════════════════════ */
.btn {
  display: inline-flex; align-items: center; gap: .55rem;
  padding: .75rem 1.25rem; border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-family: var(--font-body); font-size: .925rem; font-weight: 600;
  cursor: pointer;
  transition: transform .2s var(--ease), background-color .2s var(--ease),
              border-color .2s var(--ease), color .2s var(--ease);
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-strong); color: var(--on-accent); }
.btn-ghost { background: transparent; border-color: var(--border-2); color: var(--text); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* ══════════════════════════════════════════════════════════════════════
   SKELETON + ERROR + TOAST
   ══════════════════════════════════════════════════════════════════════ */
.sk { position: relative; overflow: hidden; background: var(--surface-2); border-radius: 6px; }
.sk::after {
  content: ""; position: absolute; inset: 0; transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, var(--surface), transparent);
  animation: shimmer 1.5s infinite;
}
@keyframes shimmer { 100% { transform: translateX(100%); } }
.sk-pill  { width: 220px; height: 30px; border-radius: 999px; margin-bottom: 1.6rem; }
.sk-h1    { width: min(100%, 640px); height: 56px; margin-bottom: .9rem; }
.sk-h1.b  { width: min(100%, 420px); }
.sk-role  { width: 260px; height: 24px; margin-bottom: 1.4rem; }
.sk-line  { width: min(100%, 620px); height: 14px; margin-bottom: .6rem; }
.sk-line.short { width: min(100%, 420px); }
.sk-btns  { display: flex; gap: .75rem; margin-top: 1.8rem; }
.sk-btn   { width: 150px; height: 44px; border-radius: var(--radius-sm); }
.sk-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; margin-top: 3.5rem;
            background: var(--border); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.sk-stats > div { background: var(--bg); padding: 1.25rem 1.35rem; }
.sk-stat-n { width: 70px; height: 28px; margin-bottom: .5rem; }
.sk-stat-l { width: 120px; height: 11px; }
@media (min-width: 720px) { .sk-stats { grid-template-columns: repeat(4, 1fr); } }
.sk-cards { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.sk-card  { height: 168px; border-radius: var(--radius); }

.sample-notice { margin:1rem auto; padding:.7rem 1rem; max-width:1000px; color:var(--text-dim); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); font-size:.78rem; line-height:1.5; }
main > .sample-notice { grid-column: 1 / -1; }
.error-panel {
  border: 1px solid var(--border); border-left: 3px solid var(--danger);
  border-radius: var(--radius); background: var(--surface);
  padding: 1.75rem 1.85rem; max-width: 65ch;
}
.error-panel h2 { font-size: calc(1.35rem * var(--h-scale)); }
.error-panel code {
  font-family: var(--font-mono); font-size: .82em;
  background: var(--surface-2); padding: .12rem .4rem; border-radius: 4px; color: var(--text);
}
.error-detail {
  font-family: var(--font-mono); font-size: .8rem; color: var(--text-dim);
  background: var(--bg-alt); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: .7rem .85rem; margin: 1rem 0 1.25rem; overflow-wrap: anywhere; white-space: pre-wrap;
}

.toast {
  position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%);
  z-index: 300; max-width: min(92vw, 52ch); margin: 0;
  padding: .75rem 1.05rem;
  background: var(--surface); color: var(--text-mid);
  border: 1px solid var(--border); border-left: 3px solid var(--accent);
  border-radius: var(--radius-sm); box-shadow: var(--shadow);
  font-size: .875rem; line-height: 1.5;
}
.toast.is-error { border-left-color: var(--danger); }

/* ══════════════════════════════════════════════════════════════════════
   SECTION SCAFFOLDING
   ══════════════════════════════════════════════════════════════════════ */
section { padding-block: var(--section-y); }
.section-alt { background: var(--bg-alt); transition: background-color var(--speed) var(--ease); }

.section-head { margin-bottom: clamp(2rem, 4vw, 3rem); max-width: 64ch; }
.eyebrow {
  display: inline-flex; align-items: center; gap: .55rem;
  font-family: var(--font-mono); font-size: .78rem;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--accent); margin-bottom: .85rem;
}
.eyebrow::before { content: ""; width: 22px; height: 1px; background: var(--accent); opacity: .6; }
.section-head p { color: var(--text-dim); margin: .4rem 0 0; }

.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip {
  font-family: var(--font-mono); font-size: .78rem;
  padding: .3rem .6rem; border-radius: var(--chip-radius);
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-mid); white-space: nowrap;
}

/* ══════════════════════════════════════════════════════════════════════
   HERO
   ══════════════════════════════════════════════════════════════════════ */
.hero { position: relative; padding-block: clamp(3.5rem, 11vw, 7.5rem) clamp(3.5rem, 9vw, 6rem); overflow: hidden; }
.hero::before {
  content: ""; position: absolute; top: -35%; left: 50%;
  width: min(900px, 130vw); aspect-ratio: 1; transform: translateX(-50%);
  background: radial-gradient(circle, var(--accent-soft) 0%, transparent 62%);
  pointer-events: none;
}
.hero > .container { position: relative; }

.hero-photo {
  width: clamp(88px, 14vw, 116px); aspect-ratio: 1;
  border-radius: 50%; object-fit: cover;
  border: 1px solid var(--border-2); margin-bottom: 1.5rem;
}
.hero-tag {
  display: inline-flex; align-items: center; gap: .6rem;
  padding: .35rem .8rem .35rem .6rem;
  border: 1px solid var(--border); border-radius: 999px;
  background: var(--surface); font-family: var(--font-mono);
  font-size: .8rem; color: var(--text-dim); margin-bottom: 1.6rem;
}
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 2.4s infinite; }
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 var(--accent-soft); }
  70%  { box-shadow: 0 0 0 9px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}
.hero h1 { max-width: 15ch; }
.hero-role {
  font-family: var(--font-display); font-size: calc(clamp(1.05rem, 2.6vw, 1.4rem) * var(--h-scale));
  font-weight: 500; color: var(--accent); margin: .5rem 0 1.15rem;
}
.hero-pitch { font-size: clamp(1.02rem, 2vw, 1.15rem); max-width: 60ch; }
.section-head h2 { overflow-wrap: anywhere; }
.hero-meta {
  display: flex; flex-wrap: wrap; gap: 1.25rem;
  margin: 1.5rem 0 2rem; font-family: var(--font-mono);
  font-size: .85rem; color: var(--text-dim);
}
.hero-meta span { display: inline-flex; align-items: center; gap: .45rem; }
.hero-cta { display: flex; flex-wrap: wrap; gap: .75rem; }
.hero-stats {
  display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 1px;
  margin: clamp(3rem, 7vw, 4.5rem) 0 0;
  background: var(--border); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
}
.hero-stats > div { background: var(--bg); padding: 1.25rem 1.35rem; }
.hero-stats dt {
  font-family: var(--font-display); font-weight: 700;
  font-size: calc(clamp(1.4rem, 3.4vw, 1.85rem) * var(--h-scale)); color: var(--text); letter-spacing: var(--h-tracking);
}
.hero-stats dd { margin: .2rem 0 0; font-size: .8rem; color: var(--text-dim); line-height: 1.45; }
@media (min-width: 720px) { .hero-stats { grid-template-columns: repeat(4, 1fr); } }

/* ══════════════════════════════════════════════════════════════════════
   ABOUT / SKILLS / TIMELINE
   ══════════════════════════════════════════════════════════════════════ */
.about-grid { display: grid; gap: clamp(2rem, 5vw, 3.5rem); }
@media (min-width: 900px) { .about-grid { grid-template-columns: 1.35fr .85fr; } }
.about-body p:last-child { margin-bottom: 0; }
.about-body strong { color: var(--text); font-weight: 600; }

.facts { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 1.4rem 1.5rem; align-self: start; }
.facts h3 { font-family: var(--font-mono); font-size: .8rem; font-weight: 500; text-transform: uppercase; letter-spacing: .09em; color: var(--text-dim); }
.facts dl { margin: .9rem 0 0; display: grid; gap: .85rem; }
.facts dt { font-size: .78rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; }
.facts dd { margin: .1rem 0 0; color: var(--text); font-size: .95rem; }

.skill-grid { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); }
.skill-card {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); padding: 1.4rem 1.5rem 1.55rem;
  transition: border-color .25s var(--ease), transform .25s var(--ease);
}
.skill-card:hover { border-color: var(--border-2); transform: translateY(-2px); }
.skill-card h3 { display: flex; align-items: center; gap: .6rem; font-size: calc(1rem * var(--h-scale)); margin-bottom: 1rem; }
.skill-card h3 .icon { color: var(--accent); }

.timeline { position: relative; padding-left: 1.9rem; }
.timeline::before {
  content: ""; position: absolute; left: 5px; top: .55rem; bottom: .55rem;
  width: 1px; background: linear-gradient(to bottom, var(--accent), var(--border) 55%);
}
.tl-item { position: relative; padding-bottom: clamp(2.25rem, 5vw, 3.25rem); }
.tl-item:last-child { padding-bottom: 0; }
.tl-item::before {
  content: ""; position: absolute; left: calc(-1.9rem + 1px); top: .55rem;
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--bg-alt); border: 2px solid var(--border-2);
}
.tl-item.is-current::before { border-color: var(--accent); background: var(--accent); }
.tl-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .35rem .75rem; }
.tl-head h3 { margin: 0; }
.tl-date { margin-left: auto; font-family: var(--font-mono); font-size: .8rem; color: var(--text-dim); white-space: nowrap; }
.tl-sub { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .6rem; font-size: .875rem; color: var(--text-dim); margin: .15rem 0 .9rem; }
.tl-company { color: var(--accent); font-weight: 600; }
.tl-sep { opacity: .45; }
.tl-dur { font-family: var(--font-mono); font-size: .75rem; padding: .1rem .45rem; border: 1px solid var(--border); border-radius: 999px; }
.tl-summary { margin: 0 0 .9rem; }
.tl-list { display: grid; gap: .6rem; margin-bottom: 1rem; }
.tl-list li { position: relative; padding-left: 1.15rem; font-size: .95rem; }
.tl-list li::before { content: ""; position: absolute; left: 0; top: .68em; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); opacity: .65; }
.tl-list strong { color: var(--text); font-weight: 600; }

/* ══════════════════════════════════════════════════════════════════════
   PROJECTS + FILTERS
   ══════════════════════════════════════════════════════════════════════ */
.filter-bar { display: flex; flex-wrap: wrap; gap: .45rem; margin-bottom: .9rem; }
.filter-btn {
  font-family: var(--font-mono); font-size: .78rem;
  padding: .38rem .75rem; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-dim); cursor: pointer;
  transition: color .2s var(--ease), border-color .2s var(--ease), background-color .2s var(--ease);
}
.filter-btn:hover { color: var(--text); border-color: var(--border-2); }
.filter-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.filter-status { font-family: var(--font-mono); font-size: .78rem; color: var(--text-dim); margin: 0 0 1.5rem; }

.project-grid { display: grid; gap: var(--gap); grid-template-columns: 1fr; }
@media (min-width: 640px) {
  .project-grid { grid-template-columns: repeat(2, 1fr); }
  .project-grid > .project-card.is-featured { grid-column: span 2; }
}
@media (min-width: 1000px) {
  .project-grid { grid-template-columns: repeat(6, 1fr); }
  .project-grid > .project-card { grid-column: span 2; }
  .project-grid > .project-card.is-featured { grid-column: span 3; }
}
.project-card {
  display: flex; flex-direction: column;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); padding: 1.45rem 1.55rem 1.55rem;
  transition: border-color .25s var(--ease), transform .25s var(--ease), box-shadow .25s var(--ease);
}
.project-card:hover { border-color: var(--border-2); transform: translateY(-3px); box-shadow: var(--shadow); }
.project-card.is-featured { padding: 1.85rem 1.95rem 1.95rem; border-color: var(--border-2); }
.project-card.is-featured h3 { font-size: calc(1.35rem * var(--h-scale)); }
.project-card.is-featured .project-blurb { font-size: 1.02rem; }
.project-cover {
  max-width: none;
  width: calc(100% + 3.1rem); margin: -1.45rem -1.55rem 1.2rem;
  border-radius: var(--radius) var(--radius) 0 0;
  aspect-ratio: 16 / 9; object-fit: cover; border-bottom: 1px solid var(--border);
}
.project-card.is-featured .project-cover { width: calc(100% + 3.9rem); margin: -1.85rem -1.95rem 1.4rem; }
.project-top { display: flex; align-items: center; gap: .7rem; margin-bottom: .7rem; }
.project-num { font-family: var(--font-mono); font-size: .75rem; color: var(--accent); letter-spacing: .08em; }
.featured-flag {
  font-family: var(--font-mono); font-size: .66rem; text-transform: uppercase; letter-spacing: .09em;
  padding: .16rem .5rem; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent);
}
.project-card h3 { margin-bottom: .5rem; }
.project-blurb { color: var(--text-mid); margin-bottom: 1.1rem; font-size: .95rem; }
.pap { display: grid; gap: .8rem; margin: 0 0 1.25rem; }
.pap > div { display: grid; grid-template-columns: 5.6rem 1fr; gap: .75rem; }
.pap dt { font-family: var(--font-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--text-dim); padding-top: .18rem; }
.pap dd { margin: 0; font-size: .92rem; line-height: 1.6; }
.pap .is-result dd { color: var(--text); }
@media (max-width: 430px) { .pap > div { grid-template-columns: 1fr; gap: .1rem; } }
.project-links { display: flex; flex-wrap: wrap; gap: .9rem; margin-bottom: 1rem; font-size: .85rem; }
.project-links a { display: inline-flex; align-items: center; gap: .35rem; }
.project-card .chips { margin-top: auto; padding-top: .35rem; }

/* ══════════════════════════════════════════════════════════════════════
   CUSTOM SECTION LAYOUTS (js/layouts.js)
   ══════════════════════════════════════════════════════════════════════ */
.custom-grid { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.custom-card {
  display: flex; flex-direction: column;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); padding: 1.4rem 1.5rem 1.5rem;
  transition: border-color .25s var(--ease), transform .25s var(--ease);
}
.custom-card:hover { border-color: var(--border-2); transform: translateY(-2px); }
.custom-card h3 { margin-bottom: .25rem; }
.custom-cover {
  max-width: none;
  width: calc(100% + 3rem); margin: -1.4rem -1.5rem 1.15rem;
  border-radius: var(--radius) var(--radius) 0 0;
  aspect-ratio: 16 / 9; object-fit: cover; border-bottom: 1px solid var(--border);
}
.custom-meta { font-family: var(--font-mono); font-size: .78rem; color: var(--text-dim); margin: 0 0 .6rem; }
.custom-sub { color: var(--accent); font-weight: 600; font-size: .9rem; margin: 0 0 .5rem; }
.custom-body { font-size: .93rem; margin-bottom: .9rem; }
.custom-card .chips, .row-item .chips { margin-top: auto; padding-top: .4rem; }
.custom-links { display: flex; flex-wrap: wrap; gap: .9rem; font-size: .85rem; margin-bottom: .7rem; }
.custom-links a { display: inline-flex; align-items: center; gap: .35rem; }

.row-list { display: grid; }
.row-item { display: grid; gap: .15rem .9rem; padding: 1.1rem 0; border-bottom: 1px solid var(--border); }
.row-item:first-child { padding-top: 0; }
.row-item:last-child { border-bottom: 0; padding-bottom: 0; }
.row-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem .8rem; }
.row-top h3 { margin: 0; font-size: calc(1.02rem * var(--h-scale)); }
.row-meta { margin-left: auto; font-family: var(--font-mono); font-size: .78rem; color: var(--text-dim); white-space: nowrap; }
.row-sub { font-size: .875rem; color: var(--accent); margin: 0; }
.row-body { font-size: .93rem; margin: .35rem 0 0; }

.prose-block { max-width: 68ch; }
.prose-block h3 { margin-top: 1.8rem; }
.prose-block h3:first-child { margin-top: 0; }

.gallery-grid { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.gallery-figure { margin: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.gallery-figure img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.gallery-figure figcaption { padding: .8rem 1rem 1rem; font-size: .875rem; }
.gallery-figure figcaption strong { display: block; color: var(--text); font-weight: 600; margin-bottom: .15rem; }
.gallery-figure figcaption span { color: var(--text-dim); font-size: .82rem; }

.stat-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 1px;
  margin: 0; background: var(--border); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
}
.stat-cell { background: var(--surface); padding: 1.4rem 1.45rem; }
.stat-cell dt {
  font-family: var(--font-display); font-weight: 700; letter-spacing: var(--h-tracking);
  font-size: calc(clamp(1.5rem, 4vw, 2.1rem) * var(--h-scale)); color: var(--accent);
}
.stat-cell dd { margin: .35rem 0 0; }
.stat-cell dd strong { display: block; color: var(--text); font-size: .95rem; font-weight: 600; }
.stat-cell dd span { display: block; font-size: .83rem; color: var(--text-dim); margin-top: .15rem; }

.quote-grid { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.quote-card {
  margin: 0; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); padding: 1.6rem 1.7rem 1.4rem;
}
.quote-card blockquote { margin: 0 0 1.1rem; position: relative; }
.quote-card blockquote::before {
  content: "\201C"; font-family: var(--font-display); font-size: 3rem; line-height: 1;
  color: var(--accent); opacity: .35; position: absolute; left: -.15em; top: -.25em;
}
.quote-card blockquote p { margin: 0; font-size: 1rem; color: var(--text-mid); }
.quote-card figcaption { display: flex; align-items: center; gap: .7rem; }
.quote-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; flex: none; }
.quote-card figcaption strong { display: block; color: var(--text); font-size: .92rem; font-weight: 600; }
.quote-card figcaption span span { font-size: .82rem; color: var(--text-dim); }

.kv-table { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.kv-row { display: grid; gap: .2rem .9rem; padding: .85rem 1.1rem; border-bottom: 1px solid var(--border); align-items: baseline; }
.kv-row:last-child { border-bottom: 0; }
@media (min-width: 620px) { .kv-row { grid-template-columns: 12rem 1fr auto; } }
.kv-key { color: var(--text); font-weight: 600; font-size: .92rem; }
.kv-val { font-size: .92rem; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.kv-meta { font-family: var(--font-mono); font-size: .78rem; color: var(--text-dim); }

/* ══════════════════════════════════════════════════════════════════════
   CERTIFICATIONS / EDUCATION / FOOTER
   ══════════════════════════════════════════════════════════════════════ */
.cert-grid { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.cert-card {
  display: flex; gap: 1rem; align-items: flex-start;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); padding: 1.35rem 1.4rem;
  transition: border-color .25s var(--ease), transform .25s var(--ease);
}
.cert-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.cert-badge {
  display: grid; place-items: center; flex: none;
  width: 42px; height: 42px; border-radius: 10px;
  background: var(--accent-soft); color: var(--accent); font-size: 1.15rem;
}
.cert-card h3 { font-size: calc(1rem * var(--h-scale)); margin-bottom: .2rem; }
.cert-card p { margin: 0; font-size: .85rem; color: var(--text-dim); }
.cert-code { font-family: var(--font-mono); font-size: .78rem; color: var(--accent); }
.cert-verify { display: inline-flex; align-items: center; gap: .3rem; font-size: .82rem; margin-top: .35rem; }

.edu-list { display: grid; gap: var(--gap); }
.edu-card {
  display: grid; gap: .3rem;
  border: 1px solid var(--border); border-left: 3px solid var(--accent);
  border-radius: var(--radius); background: var(--surface); padding: 1.5rem 1.6rem;
}
.edu-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem 1rem; }
.edu-top h3 { margin: 0; }
.edu-date { margin-left: auto; font-family: var(--font-mono); font-size: .8rem; color: var(--text-dim); }
.edu-card p { margin: 0; }
.edu-detail { font-family: var(--font-mono); font-size: .875rem; color: var(--text); }

.site-footer { border-top: 1px solid var(--border); background: var(--bg-alt); padding-block: clamp(3rem, 7vw, 4.5rem) 2rem; }
.footer-cta { max-width: 54ch; margin-bottom: 2.5rem; }
.footer-cta h2 { margin-bottom: .5rem; }
.footer-cta p { color: var(--text-dim); }
.contact-list { display: grid; gap: .75rem; margin-bottom: 2.75rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.contact-list a {
  display: flex; align-items: center; gap: .8rem;
  padding: .9rem 1.1rem; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text-mid); font-size: .92rem;
  transition: border-color .2s var(--ease), color .2s var(--ease), transform .2s var(--ease);
}
.contact-list a:hover { border-color: var(--accent); color: var(--text); transform: translateY(-2px); }
.contact-list .icon { color: var(--accent); }
.contact-list span { overflow-wrap: anywhere; }
.footer-bottom {
  display: flex; flex-wrap: wrap; gap: .5rem 1rem;
  justify-content: space-between; align-items: center;
  padding-top: 1.6rem; border-top: 1px solid var(--border);
  font-family: var(--font-mono); font-size: .82rem; color: var(--text-dim);
}
.footer-bottom p { margin: 0; }
.footer-bottom a { color: var(--text-dim); }

/* Footer columns, when the `footer` page record is published (migration 025).
   Each column is a real <nav> with its own heading, so a screen reader can
   skip between them instead of hearing one flat list of links. */
.footer-cols {
  display: grid; gap: 1.6rem 2.5rem; padding-bottom: 1.6rem;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
}
.footer-head {
  font-size: .78rem; text-transform: uppercase; letter-spacing: .08em;
  color: var(--text-dim); margin: 0 0 .55rem; font-weight: 600;
}
.footer-list { display: flex; flex-direction: column; gap: .35rem; }
.footer-list a { color: var(--text-mid); font-size: .9rem; }
.footer-list a:hover { color: var(--accent); }
.footer-bottom a:hover { color: var(--accent); }
.footer-bottom .report-link { margin-left: auto; }
.nav-more { position:relative; }
.nav-more summary { cursor:pointer; padding:.6rem; font-size:.875rem; }
.nav-more-menu { position:absolute; top:100%; right:0; width:210px; padding:.6rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow); list-style:none; }
.nav { gap:1.25rem; }
.nav-links { gap:.25rem; }

/* ══════════════════════════════════════════════════════════════════════
   SCROLL REVEAL
   ══════════════════════════════════════════════════════════════════════ */
.reveal {
  opacity: 0; transform: translateY(18px);
  transition: opacity .7s var(--ease), transform .7s var(--ease);
  transition-delay: var(--delay, 0ms);
}
.reveal.is-visible { opacity: 1; transform: none; }
/* The design galleries scale the whole page into a thumbnail without
   scrolling it. Keep every section visible there, not only the first fold. */
html[data-pf-preview] .reveal { opacity: 1; transform: none; transition: none; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: .01ms !important; animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
  .reveal { opacity: 1; transform: none; }
  .sk::after, .ia-float { animation: none; }
  .ia-draw :is(path, rect, circle, line, polyline) { stroke-dasharray: none; stroke-dashoffset: 0; animation: none; }
}

/* ══════════════════════════════════════════════════════════════════════
   RESUME / PRINT
   The resume's own styles come from js/resume.js (shared with the Word,
   HTML and PNG exports). Only the page-level swap lives here.
   #resume-root is filled on demand — keeping a second copy of the content
   in the DOM would give the page two <h1>s and duplicate text for crawlers.
   ══════════════════════════════════════════════════════════════════════ */
#resume-root { display: none; }

body.resume-preview { background: #6f6f6f; }
body.resume-preview > *:not(#resume-root) { display: none !important; }
body.resume-preview #resume-root {
  display: block; width: 210mm; min-height: 297mm;
  margin: 8mm auto; padding: 14mm;
  background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,.45);
}
body.resume-preview.paper-letter #resume-root { width: 216mm; min-height: 279mm; }
body.resume-preview #resume-root { position: relative; }
/* Where each printed page ends — drawn in preview only, never printed. */
.page-break-guide { position: absolute; left: 0; right: 0; height: 0; border-top: 1.5px dashed #9aa0a6; pointer-events: none; }
.page-break-guide span { position: absolute; right: 4mm; top: -9px; background: #fff; color: #6b7280; font: 600 10px/16px system-ui, sans-serif; padding: 0 6px; border-radius: 8px; border: 1px solid #d1d5db; }
@media print { .page-break-guide { display: none !important; } }
/* Signed preview links say what they are, and that they aren't public. */
#pf-preview-ribbon { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 9999; background: #15171a; color: #fff; font: 600 12px/1 system-ui, sans-serif; padding: 9px 14px; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
@media print { #pf-preview-ribbon { display: none; } }

@media print {
  body > *:not(#resume-root) { display: none !important; }
  #resume-root { display: block !important; padding: 0; margin: 0; width: auto; min-height: 0; box-shadow: none; }
}

/* ══════════════════════════════════════════════════════════════════════
   SIDE NAVIGATION (templates with navMode "side") — the header becomes a
   vertical rail at ≥960px. Below that it stays the ordinary top bar.
   ══════════════════════════════════════════════════════════════════════ */
@media (min-width: 960px) {
  body.is-sidenav {
    display: grid; grid-template-columns: 240px 1fr; align-items: start;
  }
  body.is-sidenav .site-header {
    grid-row: 1 / -1; height: 100vh; position: sticky; top: 0;
    border-bottom: none; border-right: 1px solid var(--border);
  }
  body.is-sidenav .site-header > .container { height: 100%; padding-block: 1.5rem; }
  body.is-sidenav .nav { flex-direction: column; align-items: flex-start; height: auto; gap: 1.75rem; }
  body.is-sidenav .nav-links { flex-direction: column; align-items: stretch; width: 100%; }
  body.is-sidenav .nav-actions { margin-top: auto; flex-wrap: wrap; }
  body.is-sidenav > main, body.is-sidenav > footer, body.is-sidenav > p.toast { grid-column: 2; min-width: 0; }
  body.is-sidenav > .skip-link, body.is-sidenav > .visually-hidden { grid-column: 1 / -1; }
}
body.is-dense { --gap: .9rem; }
.hero-stats { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }

/* ══════════════════════════════════════════════════════════════════════
   TEMPLATE PARTS — pieces several templates share (js/render.js)
   ══════════════════════════════════════════════════════════════════════ */
.btn-lg { padding: .95rem 1.55rem; font-size: 1rem; }
.chip { max-width: 100%; overflow-wrap: anywhere; white-space: normal; }

.row-rows { display: grid; }
.row-rows > li { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: .25rem 1.5rem; padding: 1rem 0; border-bottom: 1px solid var(--border); align-items: baseline; }
.row-rows > li:first-child { padding-top: 0; }
.row-rows > li:last-child { border-bottom: 0; padding-bottom: 0; }

.rr-detail { margin: .35rem 0 0; font-size: .9rem; }

@media (min-width: 900px) {
  .row-rows.credential-grid { grid-template-columns: repeat(2, minmax(0,1fr)); column-gap: clamp(1.5rem,3vw,3rem); align-items:start; }
  .row-rows.credential-grid > li:first-child { padding-top: 1rem; }
  .row-rows.credential-grid > li:nth-child(-n+2) { border-top: 1px solid var(--border); }
}

.skill-rows { display: grid; margin: 0; }
.skill-rows > div { display: grid; grid-template-columns: 13rem minmax(0,1fr); gap: .3rem 1.5rem; padding: .85rem 0; border-bottom: 1px solid var(--border); }

.skill-rows > div:last-child { border-bottom: 0; }

.skill-rows dd { margin: 0; min-width: 0; }
@media (max-width: 640px) { .skill-rows > div { grid-template-columns: minmax(0,1fr); } }

.toolkit { display: grid; gap: 1.5rem 2rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.toolkit-group h3 { display: flex; align-items: center; gap: .55rem; font-size: calc(1rem * var(--h-scale)); margin-bottom: .8rem; }

.pap-inline > div { grid-template-columns: 5.6rem minmax(0,1fr); }
.project-card :is(.project-links, .chips) { max-width: 100%; }
.work-story, .client-more { margin: .4rem 0 .6rem; }
:is(.work-story, .client-more) > summary { cursor: pointer; width: fit-content; font-size: .88rem; font-weight: 600; color: var(--accent); list-style: none; }
:is(.work-story, .client-more) > summary::-webkit-details-marker { display: none; }
:is(.work-story, .client-more) > summary::after { content: " +"; }
:is(.work-story, .client-more)[open] > summary::after { content: " −"; }

body[data-skeleton] .brand { font-family: var(--font-display); font-weight: var(--h-weight); font-size: 1rem; letter-spacing: var(--h-tracking); }

/* Portfolio pages only: the soft hero glow is a theme decision (see the
   bold-gradient and soft-modern signatures), not every template's. */
body[data-skeleton] .hero::before { display: none; }

/* ══════════════════════════════════════════════════════════════════════
   TEMPLATES (js/skeletons.js) — one block each. Structure only: every
   colour, font, radius and shadow is a theme token, so all ten themes
   work with all eight templates.
   ══════════════════════════════════════════════════════════════════════ */

/* ── 1. CLEAN RECRUITER — a resume set as a calm single column ─────── */
/* Use the desktop canvas instead of compressing the whole portfolio into a
   narrow centre column. Individual paragraphs retain readable line-length
   limits, while navigation, stats, projects and section rules can breathe. */
body[data-skeleton="clean-recruiter"] .container { max-width: var(--maxw); }
body[data-skeleton="clean-recruiter"] .hero { padding-block: clamp(2.75rem, 8vw, 5.5rem) clamp(1.5rem, 4vw, 2.5rem); }
.hero--recruiter .rc-id { display: flex; align-items: center; gap: 1.25rem; margin-bottom: 1.3rem; }
.hero--recruiter .hero-photo { width: 88px; height: 88px; margin: 0; border-radius: 50%; flex: none; }
.hero--recruiter h1 { font-size: calc(clamp(2.1rem, 5.6vw, 3.2rem) * var(--h-scale)); max-width: none; margin: 0; line-height: 1.08; }
.hero--recruiter .hero-role { font-family: var(--font-body); color: var(--text-mid); font-size: clamp(1.05rem, 2.4vw, 1.25rem); font-weight: 500; margin: .35rem 0 0; }
.hero--recruiter .hero-pitch { font-size: clamp(1.04rem, 2vw, 1.18rem); color: var(--text); max-width: 64ch; }
.hero--recruiter .hero-meta { margin: 1rem 0 1.6rem; gap: .45rem 1.35rem; font-family: var(--font-body); font-size: .92rem; }
.hero--recruiter .hero-meta :is(a, span) { display: inline-flex; align-items: center; gap: .42rem; color: var(--text-mid); overflow-wrap: anywhere; }
.hero--recruiter .hero-meta a:hover { color: var(--accent); }
.hero--recruiter .hero-meta .icon { color: var(--text-dim); }
.hero--recruiter .hero-tag { margin: 1.4rem 0 0; }
.hero--recruiter .rc-stats { display: flex; flex-wrap: wrap; gap: .75rem 0; margin: 2rem 0 0; padding: 1.05rem 0; background: none; border: 0; border-block: 1px solid var(--border); border-radius: 0; }
.hero--recruiter .rc-stats > div { background: none; padding: 0 1.4rem 0 0; margin-right: 1.4rem; border-right: 1px solid var(--border); display: flex; align-items: baseline; gap: .5rem; }
.hero--recruiter .rc-stats > div:last-child { border-right: 0; margin-right: 0; padding-right: 0; }
.hero--recruiter .rc-stats dt { font-size: calc(1.35rem * var(--h-scale)); }
.hero--recruiter .rc-stats dd { margin: 0; font-size: .84rem; }
@media (max-width: 600px) {
  .hero--recruiter .rc-stats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); }
  .hero--recruiter .rc-stats > div { border: 0; margin: 0; padding: 0; flex-direction: column; gap: 0; }
  .hero--recruiter .rc-id { align-items: flex-start; }
  .hero--recruiter .hero-photo { width: 64px; height: 64px; }
}
body[data-skeleton="clean-recruiter"] .section { padding-block: clamp(2.1rem, 5vw, 3.2rem); }
body[data-skeleton="clean-recruiter"] .section-alt { background: transparent; }
body[data-skeleton="clean-recruiter"] .section-head { display: grid; grid-template-columns: minmax(0, max-content) minmax(2rem, 1fr); align-items: center; column-gap: 1rem; max-width: none; margin-bottom: 1.5rem; }
body[data-skeleton="clean-recruiter"] .section-head::after { content: ""; height: 1px; background: var(--border-2); }
body[data-skeleton="clean-recruiter"] .section-head .eyebrow { display: none; }
body[data-skeleton="clean-recruiter"] .section-head > p:not(.eyebrow) { order: 2; grid-column: 1 / -1; }
body[data-skeleton="clean-recruiter"] .section-head h2 { margin: 0; font-family: var(--font-body); font-size: .8rem; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; color: var(--text); }
body[data-skeleton="clean-recruiter"] .about-body { max-width: 70ch; }
body[data-skeleton="clean-recruiter"] .about-body p:first-child { color: var(--text); font-size: 1.05rem; }
body[data-skeleton="clean-recruiter"] .facts.rc-facts { margin-top: 1.6rem; padding: 0; border: 0; background: none; }
body[data-skeleton="clean-recruiter"] .rc-facts dl { margin: 0; padding-top: 1.2rem; border-top: 1px dashed var(--border); grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 1rem 1.5rem; }

/* Concise portfolios should look deliberately composed, not like a narrow
   document floating in a large empty monitor. The content decides when this
   treatment is used; mobile remains a normal single column. */
@media (min-width: 1000px) {
  body[data-skeleton="clean-recruiter"].is-sparse main,
  body[data-skeleton="studio-split"] main {
    display: grid; grid-template-columns: minmax(290px, .72fr) minmax(0, 1.28fr);
    column-gap: clamp(3rem, 7vw, 7rem); align-items: start;
    width: 100%; max-width: min(var(--maxw), 1760px); margin-inline: auto; padding-inline: var(--gutter);
  }
  body[data-skeleton="clean-recruiter"].is-sparse main > .hero,
  body[data-skeleton="studio-split"] main > .hero {
    grid-column: 1; grid-row: 1; position: sticky; top: var(--nav-h);
    min-width: 0; padding-block: clamp(3rem, 7vw, 5.5rem);
  }
  body[data-skeleton="clean-recruiter"].is-sparse main > .portfolio-sections,
  body[data-skeleton="studio-split"] main > .portfolio-sections { grid-column: 2; grid-row: 1; min-width: 0; }
  body[data-skeleton="clean-recruiter"].is-sparse main > .hero > .container,
  body[data-skeleton="studio-split"] main > .hero > .container,
  body[data-skeleton="clean-recruiter"].is-sparse .portfolio-sections > .section > .container,
  body[data-skeleton="studio-split"] .portfolio-sections > .section > .container { max-width: none; padding-inline: 0; }
  body[data-skeleton="clean-recruiter"].is-sparse .hero--recruiter .rc-id,
  body[data-skeleton="studio-split"] .hero--recruiter .rc-id { align-items: flex-start; flex-direction: column; }
  body[data-skeleton="clean-recruiter"].is-sparse .hero--recruiter .hero-photo,
  body[data-skeleton="studio-split"] .hero--recruiter .hero-photo { width: 112px; height: 112px; }
  body[data-skeleton="clean-recruiter"].is-sparse .hero--recruiter .rc-stats,
  body[data-skeleton="studio-split"] .hero--recruiter .rc-stats { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); }
  body[data-skeleton="clean-recruiter"].is-sparse .hero--recruiter .rc-stats > div,
  body[data-skeleton="studio-split"] .hero--recruiter .rc-stats > div { margin: 0; padding: .65rem 0; border-right: 0; }
}

/* ── 9. STUDIO SPLIT — permanent profile rail + working canvas ─────── */

@media (min-width:1000px) {
  body[data-skeleton="studio-split"] .hero--studio { padding-inline:clamp(1.25rem,2.5vw,2.25rem); margin-block:1.5rem; }
  body[data-skeleton="studio-split"] .hero--studio > .container { padding-inline:0; }
}

/* ── 10. MODERN LEDGER — wide numbered editorial bands ─────────────── */
body[data-skeleton="modern-ledger"] .container { max-width: var(--maxw); }
body[data-skeleton="modern-ledger"] .hero { padding-block: clamp(3rem, 9vw, 7rem); border-bottom: 1px solid var(--border-2); }
body[data-skeleton="modern-ledger"] .hero--ledger h1 { max-width: none; font-size: calc(clamp(3rem, 9vw, 7.5rem) * var(--h-scale)); line-height: .9; letter-spacing: -.055em; }

body[data-skeleton="modern-ledger"] .hero--ledger .hero-tag { justify-self:start; }
@media (min-width:1100px) {
  body[data-skeleton="modern-ledger"] .hero--ledger .container:has(.rc-stats > div) { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(300px,.6fr); gap:0 clamp(2.5rem,5vw,6rem); align-items:start; }
  body[data-skeleton="modern-ledger"] .hero--ledger .container > :not(.rc-stats) { grid-column:1; }
  body[data-skeleton="modern-ledger"] .hero--ledger .rc-stats { grid-column:2; grid-row:1 / span 8; display:grid; grid-template-columns:1fr; gap:0; margin:0; padding:clamp(1.5rem,3vw,2.5rem); border:1px solid var(--border-2); border-radius:var(--radius); background:var(--surface); }
  body[data-skeleton="modern-ledger"] .hero--ledger .rc-stats > div { margin:0; padding:1rem 0; border-right:0; border-bottom:1px solid var(--border); flex-direction:column; gap:.25rem; }
  body[data-skeleton="modern-ledger"] .hero--ledger .rc-stats > div:last-child { border-bottom:0; }
}
body[data-skeleton="modern-ledger"] .section { padding-block: clamp(3rem,7vw,5.5rem); border-bottom: 1px solid var(--border); counter-increment: ledger-section; }
body[data-skeleton="modern-ledger"] main { counter-reset: ledger-section; }
body[data-skeleton="modern-ledger"] .section-alt { background: transparent; }
@media (min-width: 900px) {
  body[data-skeleton="modern-ledger"] .section > .container { display: grid; grid-template-columns: minmax(150px,.35fr) minmax(0,1.65fr); gap: clamp(2.5rem,6vw,6rem); }
  body[data-skeleton="modern-ledger"] .section > .container > * { grid-column: 2; }
  body[data-skeleton="modern-ledger"] .section-head { grid-column: 1 !important; grid-row: 1; margin: 0; max-width: none; align-self:start; }
  body[data-skeleton="modern-ledger"] .section > .container > :nth-child(2) { grid-row:1; }
  body[data-skeleton="modern-ledger"] .section-head::before { content: counter(ledger-section, decimal-leading-zero); display: block; margin-bottom: 1rem; font: 600 .78rem var(--font-mono); color: var(--accent); letter-spacing: .12em; }
  body[data-skeleton="modern-ledger"] .section-head h2 { font-size: calc(clamp(1.15rem,2vw,1.55rem) * var(--h-scale)); }
}

body[data-skeleton="engineering-blueprint"] .hero--blueprint h1 { max-width:none; }
body[data-skeleton] .profile-intro { margin:1rem 0; color:var(--text-mid); font-size:.92rem; line-height:1.6; }

body[data-skeleton] .profile-intro p { margin:.7rem 0 0; }
body[data-skeleton="engineering-blueprint"] .repo-grid { grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr)); }
body[data-skeleton="engineering-blueprint"] .repo-card { border-color:var(--border-2); }

  body[data-skeleton="engineering-blueprint"] main { display:grid; grid-template-columns:minmax(280px,.58fr) minmax(0,1.42fr); gap:clamp(2rem,5vw,5rem); max-width:var(--maxw); margin-inline:auto; padding-inline:var(--gutter); align-items:start; }
  body[data-skeleton="engineering-blueprint"] main > .hero { position:sticky; top:calc(var(--nav-h) + 1.5rem); grid-column:1; grid-row:1; padding:clamp(1.5rem,3vw,2.5rem); }

  body[data-skeleton="engineering-blueprint"] .hero--blueprint .rc-stats { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); }
  body[data-skeleton="engineering-blueprint"] .hero--blueprint .rc-stats > div { flex-direction:column; border:0; margin:0; padding:.7rem 0; }
}
body[data-skeleton="project-workbench"] .hero--workbench { background:linear-gradient(120deg,var(--bg-alt),var(--bg)); border-bottom:1px solid var(--border-2); }
body[data-skeleton="project-workbench"] .hero--workbench .statement { max-width:26ch; }
body[data-skeleton="project-workbench"] .hero--workbench .hero-tag { justify-self:start; }
body[data-skeleton="project-workbench"] .case-index { max-width:none; border:1px solid var(--border-2); border-radius:var(--radius); background:var(--surface); }
body[data-skeleton="project-workbench"] .case-chapter { padding:clamp(1.5rem,3vw,2.5rem); border:1px solid var(--border-2); border-radius:var(--radius); background:var(--surface); }
body[data-skeleton="project-workbench"] .case-chapter .case-head { padding-bottom:1.25rem; border-bottom:1px solid var(--border); }

body[data-skeleton="project-workbench"] .workbench-panel { padding:clamp(1.4rem,3vw,2.3rem); align-self:start; border:1px solid var(--border-2); border-radius:var(--radius); background:var(--surface); }

/* ══════════════════════════════════════════════════════════════════════
   THEME SIGNATURES (js/themes.js `style`) — the details a colour token
   can't express. Scoped to rendered portfolios (body[data-skeleton]) so
   platform pages only ever take a theme's tokens.
   ══════════════════════════════════════════════════════════════════════ */
/* Minimal Light: hairlines and restraint; underline on hover only. */
[data-theme-style="minimal-light"] body[data-skeleton] main p a:not(.btn):hover { text-decoration: underline; text-underline-offset: 3px; }
[data-theme-style="minimal-light"] body[data-skeleton] .section { border-bottom: 1px solid var(--border); }
[data-theme-style="minimal-light"] body[data-skeleton] .section-alt { background: transparent; }
[data-theme-style="minimal-light"] body[data-skeleton] :is(.project-card,.skill-card,.cert-card,.edu-card,.custom-card,.service-card,.chart,.report-card) { box-shadow: none; }
[data-theme-style="minimal-light"] body[data-skeleton] .chip { background: transparent; border-color: var(--border-2); }

/* Editorial B&W: a masthead rule, underlined links, rules instead of boxes. */
[data-theme-style="editorial-bw"] body[data-skeleton] .site-header { border-bottom: 1px solid var(--text); }
[data-theme-style="editorial-bw"] body[data-skeleton] .site-footer { border-top: 4px double var(--text); }
[data-theme-style="editorial-bw"] body[data-skeleton] :is(main, footer) :is(p, li, dd) a:not(.btn) { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
[data-theme-style="editorial-bw"] body[data-skeleton] .eyebrow:not(.term-cmd) { font-family: var(--font-body); font-style: italic; font-size: .98rem; letter-spacing: 0; text-transform: none; color: var(--text-mid); }
[data-theme-style="editorial-bw"] body[data-skeleton] .eyebrow::before { width: 34px; height: 2px; background: var(--text); opacity: 1; }
[data-theme-style="editorial-bw"] body[data-skeleton] :is(.skill-card, .cert-card, .edu-card, .custom-card, .service-card, .quote-card, .project-card.repo-card, .project-card.case, .project-card.finding, .project-card.client-card, .case-steps li, .chart, .report-card, .readme, .code-file, .ledger-rows, .dossier-card, .stat-grid) { background: transparent; border-width: 0; border-top: 3px solid var(--text); border-radius: 0; box-shadow: none; }
[data-theme-style="editorial-bw"] body[data-skeleton] .project-card:not(.work-tile):not(.case-chapter):not(.proj-row):not(.research) { background: transparent; border-width: 0; border-top: 3px solid var(--text); border-radius: 0; box-shadow: none; }
[data-theme-style="editorial-bw"] body[data-skeleton] :is(.project-card, .custom-card, .skill-card) :is(.project-cover, .custom-cover) { width: 100%; margin: 0 0 1.1rem; }
[data-theme-style="editorial-bw"] body[data-skeleton] .chip { background: transparent; border-color: var(--text); color: var(--text); font-family: var(--font-body); }
[data-theme-style="editorial-bw"] body[data-skeleton] .btn-ghost { border: 1px solid var(--text); }
[data-theme-style="editorial-bw"] body[data-skeleton] .hero h1 { letter-spacing: -.028em; }

/* Technical Dark: mono controls, accent borders on hover, // eyebrows. */
[data-theme-style="technical-dark"] body[data-skeleton] .btn { font-family: var(--font-mono); font-size: .86rem; letter-spacing: -.01em; }
[data-theme-style="technical-dark"] body[data-skeleton] .eyebrow:not(.term-cmd)::before { content: "//"; width: auto; height: auto; background: none; opacity: 1; color: var(--text-dim); }
[data-theme-style="technical-dark"] body[data-skeleton] :is(.project-card, .skill-card, .custom-card, .service-card, .cert-card):hover { border-color: var(--accent); }
[data-theme-style="technical-dark"] body[data-skeleton] .chip { font-size: .74rem; }
[data-theme-style="technical-dark"] body[data-skeleton] ::selection { background: var(--accent); color: var(--on-accent); }

/* Warm Professional: sans eyebrows, soft chips, a ringed portrait, glow on CTAs. */
[data-theme-style="warm-professional"] body[data-skeleton] .eyebrow:not(.term-cmd) { font-family: var(--font-body); font-weight: 700; font-size: .74rem; }

[data-theme-style="warm-professional"] body[data-skeleton] .section-alt { background: linear-gradient(180deg, var(--bg-alt), var(--bg)); }

/* Bold Gradient: gradient display type, glowing CTAs, a stage-light hero. */
[data-theme-style="bold-gradient"] body[data-skeleton] .hero::before { display: block; top: -45%; left: 70%; width: min(1000px, 140vw); background: radial-gradient(circle, color-mix(in srgb, var(--accent) 24%, transparent) 0%, transparent 60%); }
[data-theme-style="bold-gradient"] body[data-skeleton] :is(.hero h1, .hero .statement, .footer-cta h2) { background: linear-gradient(100deg, var(--text) 0%, var(--accent) 58%, color-mix(in srgb, var(--accent) 45%, #ff9a1f) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
[data-theme-style="bold-gradient"] body[data-skeleton="freelancer-services"] .footer-cta h2 { background: none; color: var(--on-accent); }
[data-theme-style="bold-gradient"] body[data-skeleton] .btn-primary { box-shadow: 0 12px 32px -12px var(--accent); }
[data-theme-style="bold-gradient"] body[data-skeleton] .eyebrow:not(.term-cmd)::before { width: 30px; height: 3px; border-radius: 3px; opacity: 1; background: linear-gradient(90deg, var(--accent), #ffb347); }
[data-theme-style="bold-gradient"] body[data-skeleton] .chip { border-color: transparent; background: color-mix(in srgb, var(--accent) 12%, var(--surface-2)); color: var(--text); }

/* Executive Navy: gold hairlines, spaced caps, quiet outline buttons. */
[data-theme-style="executive-navy"] body[data-skeleton] .site-header.is-stuck { border-bottom-color: var(--border-2); }
[data-theme-style="executive-navy"] body[data-skeleton] .eyebrow:not(.term-cmd) { font-family: var(--font-body); font-weight: 600; font-size: .72rem; }
[data-theme-style="executive-navy"] body[data-skeleton] .eyebrow::before { background: var(--border-2); opacity: 1; width: 30px; }
[data-theme-style="executive-navy"] body[data-skeleton] .btn { font-size: .86rem; letter-spacing: .06em; text-transform: uppercase; }
[data-theme-style="executive-navy"] body[data-skeleton] .btn-ghost { border-color: var(--border-2); }
[data-theme-style="executive-navy"] body[data-skeleton] .chip { background: transparent; border-color: var(--border-2); font-family: var(--font-body); }
[data-theme-style="executive-navy"] body[data-skeleton] .hero { border-bottom: 1px solid var(--border-2); }

/* Creative Colorful: ink outlines, sticker eyebrows, a rotating palette. */
[data-theme-style="creative-colorful"] body[data-skeleton] { --c1: #ffe39a; --c2: #c6efd9; --c3: #cfe4ff; --c4: #ffd2dc; }
[data-theme="dark"][data-theme-style="creative-colorful"] body[data-skeleton] { --c1: #ffd166; --c2: #7fe0b0; --c3: #8cc4ff; --c4: #ff9eb5; }
[data-theme-style="creative-colorful"] body[data-skeleton] .eyebrow:not(.term-cmd) { padding: .28rem .75rem; border-radius: 999px; background: var(--text); color: var(--bg); font-family: var(--font-body); font-weight: 700; font-size: .72rem; }
[data-theme-style="creative-colorful"] body[data-skeleton] .eyebrow:not(.term-cmd)::before { display: none; }

/* ══════════════════════════════════════════════════════════════════════
   SUPPORT-SESSION WATERMARK. Set by the builder over postMessage when a
   support agent is viewing a customer's account, so a screenshot of the
   rendered preview can never be mistaken for the customer's own page.
   ══════════════════════════════════════════════════════════════════════ */
#pf-watermark {
  position: fixed; inset: 0; z-index: 500; pointer-events: none;
  background-image: repeating-linear-gradient(-45deg, rgba(227,179,65,.08) 0 2px, transparent 2px 22px);
}
#pf-watermark::after {
  content: attr(data-label);
  position: absolute; inset: 0; display: grid; place-content: center;
  font-family: ui-monospace, monospace; font-size: clamp(1.5rem, 8vw, 6rem);
  font-weight: 700; letter-spacing: .1em; color: rgba(227,179,65,.1);
  transform: rotate(-24deg); white-space: nowrap;
}
@media print { #pf-watermark::after { color: rgba(120,90,20,.2); } }

/* ── Marketing layouts (shared registry: platform pages + portfolios) ─── */
.mk-hero { padding: clamp(2rem, 6vw, 4rem) 0 1rem; max-width: 62rem; }
.mk-hero-title { font-size: clamp(2.1rem, 5vw, 3.4rem); letter-spacing: -.03em; margin-bottom: 1.1rem; }
.mk-hero-lead { font-size: 1.15rem; color: var(--text-mid); max-width: 56ch; }
.mk-cta-row { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.6rem; }
.mk-grid { display: grid; gap: var(--gap, 1.2rem); grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.mk-grid > * { min-width: 0; }
.mk-feature { padding: 1.4rem 1.3rem; border: 1px solid var(--border); border-radius: var(--radius, 12px); background: var(--surface); }
.mk-feature h3 { margin: .5rem 0 .4rem; font-size: 1.05rem; }
.mk-feature p { color: var(--text-mid); font-size: .95rem; }
.mk-fi { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.mk-fi svg, .mk-fi .icon { width: 19px; height: 19px; }
/* Lucide REPLACES the <i data-lucide> with an <svg>. If the element is still
   an <i>, the icon script never arrived — so drop the tinted box rather than
   leave an empty coloured square where an icon should be. */
.mk-fi:has(> i[data-lucide]) { background: none; width: auto; height: 0; }
.mk-price-grid { display: grid; gap: var(--gap, 1.2rem); grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); align-items: start; }
.mk-price-grid > * { min-width: 0; }
.mk-price { padding: 1.6rem 1.5rem; border: 1px solid var(--border); border-radius: var(--radius, 12px); background: var(--surface); display: flex; flex-direction: column; gap: .9rem; }
.mk-price.featured { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.mk-price-n strong { font-size: 2.2rem; letter-spacing: -.03em; }
.mk-price-n span { color: var(--text-dim); margin-left: .35rem; font-size: .85rem; }
.mk-price-list { list-style: none; padding: 0; margin: 0; display: grid; gap: .45rem; font-size: .92rem; color: var(--text-mid); }
.mk-price-list li::before { content: "✓  "; color: var(--accent); }
.mk-faq { max-width: 46rem; display: grid; gap: .6rem; }
.mk-faq-item { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 0 1.1rem; }
.mk-faq-item summary { cursor: pointer; padding: .95rem 0; font-weight: 600; list-style: none; position: relative; }
.mk-faq-item summary::after { content: "+"; position: absolute; right: .1rem; color: var(--text-dim); }
.mk-faq-item[open] summary::after { content: "–"; }
.mk-faq-a { padding: 0 0 1rem; color: var(--text-mid); font-size: .95rem; }
.mk-logos { display: flex; flex-wrap: wrap; gap: 1.2rem 2.4rem; align-items: center; justify-content: center; opacity: .8; }
.mk-logo-img { max-height: 34px; width: auto; }
.mk-logo-text { font-family: var(--font-mono); font-size: .95rem; letter-spacing: .06em; color: var(--text-dim); }
.mk-band { display: flex; flex-wrap: wrap; gap: 1.2rem; align-items: center; justify-content: space-between; padding: 1.8rem 1.7rem; border: 1px solid var(--border); border-radius: var(--radius, 12px); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.mk-band h3 { font-size: 1.35rem; margin-bottom: .3rem; }
.mk-band p { color: var(--text-mid); }
.mk-quote { margin: 0; padding: 1.4rem 1.3rem; border: 1px solid var(--border); border-radius: var(--radius, 12px); background: var(--surface); }
.mk-quote blockquote { margin: 0 0 .8rem; font-size: 1rem; color: var(--text); }
.mk-quote figcaption { font-size: .85rem; color: var(--text-dim); }
.mk-steps { list-style: none; counter-reset: none; padding: 0; margin: 0; display: grid; gap: var(--gap, 1.2rem); grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.mk-steps > * { min-width: 0; }
.mk-step { position: relative; padding: 1.3rem 1.2rem 1.2rem; border: 1px solid var(--border); border-radius: var(--radius, 12px); background: var(--surface); }
.mk-step-n { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--on-accent, #fff); font-weight: 700; font-size: .9rem; margin-bottom: .7rem; }
.mk-step h3 { font-size: 1rem; margin-bottom: .35rem; }
.mk-step p { color: var(--text-mid); font-size: .92rem; }
.mk-compare table { width: 100%; }
.mk-ours { color: var(--accent); font-weight: 600; }
.mk-note { color: var(--text-dim); font-style: italic; }
/* Pricing-table annotations: what the number includes, what the card is
   actually charged, and the "not sold here" state — all of which are
   supporting text, not the price itself, so they de-emphasise. */
.mk-tax, .mk-charge, .mk-unavailable { font-size: .8rem; font-style: normal; margin: .2rem 0 0; }
.mk-unavailable { color: var(--warn-tx, var(--text-dim)); }
.mk-region { font-size: .8rem; margin-top: 1.25rem; text-align: center; }
/* A plan with no price in this region gets a button-shaped non-button: it
   has to look inert rather than look broken. */
.btn.is-disabled { opacity: .55; pointer-events: none; display: inline-block; }

/* ── Scrollable rails (reviews, logos, galleries) ──────────────────────
   Many items go sideways rather than down the page. Every item stays in
   the DOM and in order — this is a scroll container, not a carousel that
   swaps slides, so crawlers, Reader mode and Ctrl-F all see everything.
   Nothing auto-advances, so there is no motion to suppress beyond the
   smooth-scroll below.                                                  */
.rail { position: relative; }
.rail-track {
  display: flex; gap: .9rem; overflow-x: auto; scroll-snap-type: x proximity;
  padding: .2rem .2rem 1rem; margin: 0; list-style: none;
  scrollbar-width: thin; overscroll-behavior-x: contain;
}
.rail-track > .rail-item { flex: 0 0 min(92%, 340px); scroll-snap-align: start; }
.rail-track:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: var(--radius); }
.rail-controls { display: flex; align-items: center; gap: .5rem; }
.rail-btn {
  width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
  border: 1px solid var(--border-2); background: var(--surface); color: var(--text);
  font-size: 1.1rem; line-height: 1;
}
.rail-btn:hover { border-color: var(--accent); color: var(--accent); }
.rail-count { font-family: var(--font-mono); font-size: .78rem; color: var(--text-dim); }
.stars { color: var(--accent); letter-spacing: .1em; margin-bottom: .5rem; font-size: .95rem; }
@media (prefers-reduced-motion: reduce) { .rail-track { scroll-behavior: auto; } }

/* Template gallery: a rail of preview cards. Wider items than a review
   card because the point is the picture. */
.mk-template { display: flex; flex-direction: column; gap: .6rem; margin: 0; }
.mk-template-img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border); }
.mk-template figcaption { display: flex; flex-direction: column; gap: .2rem; }
.mk-template figcaption strong { font-family: var(--font-display); }
.mk-template-sub, .mk-template-body { color: var(--text-dim); font-size: .85rem; }
.rail-track > .mk-template { flex: 0 0 min(88%, 400px); }
/* A logo rail keeps items at their natural width rather than card width. */
.rail-track > .mk-logo { flex: 0 0 auto; }

/* ── The ATS checker widget (layout id: ats_widget) ────────────────────── */
.ats-widget { display: grid; gap: 1.5rem; }
.ats-form { display: flex; flex-direction: column; gap: .55rem; max-width: 680px; }
.ats-label { font-family: var(--font-display); color: var(--text); font-size: .95rem; margin-top: .5rem; }
.ats-form textarea, .ats-file-input {
  width: 100%; padding: .7rem .8rem; border-radius: var(--radius-sm);
  border: 1px solid var(--border-2); background: var(--surface); color: var(--text);
  font-family: var(--font-body); font-size: .92rem; line-height: 1.5;
}
.ats-form textarea { resize: vertical; }
.ats-actions { display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; margin-top: .4rem; }
.ats-status { margin: 0; color: var(--warn); font-size: .88rem; }
.ats-file { margin: 0; }

.ats-out:empty { display: none; }
.ats-out { display: grid; gap: .5rem; padding: 1.3rem; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); }
.ats-out h3 { margin: .9rem 0 .1rem; font-size: 1rem; }
.ats-score { display: flex; align-items: baseline; gap: .4rem; }
.ats-score strong { font-family: var(--font-display); font-size: 3rem; line-height: 1; }
.ats-score span { color: var(--text-dim); font-size: .95rem; }
.ats-score.is-ok strong { color: var(--accent); }
.ats-score.is-mid strong { color: var(--warn); }
.ats-score.is-low strong { color: var(--danger); }
.ats-checks, .ats-flags, .ats-advice { display: grid; gap: .3rem; font-size: .9rem; }
.ats-advice { padding-left: 1.2rem; list-style: decimal; }
.ats-checks .is-ok { color: var(--text-mid); }
.ats-checks .is-missing { color: var(--danger); }
.ats-flags li { color: var(--text-mid); }
.ats-worth { color: var(--accent); font-family: var(--font-mono); font-size: .78rem; }
.ats-gate {
  margin-top: 1rem; padding: 1rem; border-radius: var(--radius-sm);
  background: var(--bg-alt); border: 1px solid var(--border-2);
  display: grid; gap: .6rem; justify-items: start;
}
.ats-gate p { margin: 0; }
.ats-honest { font-style: italic; margin-top: .8rem; }
</style>
</head>
